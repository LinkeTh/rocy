[package]
name = "rocy"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.4", features = ["macros", "multipart", "tokio"] }
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
dotenvy = "0.15.7"
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "macros", "uuid", "chrono"] }
thiserror = "2.0.16"
ulid = "1.2.1"
axum-prometheus = "0.9"
axum-extra = { version = "0.10.1", features = ["cookie-private", "cookie"] }
cookie = "0.18.1"
tower-http = { version = "0.6.6", features = ["fs"] }
tower = "0.5.2"

