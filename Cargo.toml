[package]
name = "rocy"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.4", features = ["macros", "multipart", "tokio"] }
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
dotenvy = "0.15.7"
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.9.2"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "macros", "uuid", "chrono"] }
thiserror = "2.0.16"
ulid = "1.2.1"
axum-prometheus = "0.9"
axum-extra = { version = "0.10.1", features = ["cookie-private", "cookie"] }
cookie = "0.18.1"
tower-http = { version = "0.6.6", features = ["fs", "cors", "trace", "set-header", "mime_guess", "mime"] }
base64 = "0.22"
async-trait = "0.1.89"
async-openai = { version = "0.29.3", features = ["byot"] }
schemars = "1.0.4"

#ocrs = "0.11.0"
#rayon = "1.10.0"
#rten = "0.22.1"
#rten-imageproc = "0.22.1"
#rten-tensor = "0.22.1"
#image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "webp"] }
#anyhow = "1.0.100"

#[dev-dependencies]
#fastrand = "2.3.0"
#lexopt = "0.3.1"
#rten = { version = "0.22.1", features = ["model_builder"] }
